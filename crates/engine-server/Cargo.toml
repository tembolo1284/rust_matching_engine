[package]
name = "engine-server"
version = "0.1.0"
edition = "2021"
description = "Multi-protocol TCP/UDP server for the matching engine"

[dependencies]
engine-core = { path = "../engine-core" }
engine-protocol = { path = "../engine-protocol" }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "io-std",
    "sync",
    "signal",
    "time",
    "macros"
] }

# Fast hashing for client registry
rustc-hash = "1.1"

# Socket options for multicast
socket2 = { version = "0.5", features = ["all"] }
arrayvec = "0.7"

[dev-dependencies]
tokio-test = "0.4"
arrayvec = "0.7"

[[bin]]
name = "engine-server"
path = "src/main.rs"
