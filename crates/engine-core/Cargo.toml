[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
authors = ["Paul Lopez"]
description = "High-performance matching engine core"
keywords = ["trading", "matching-engine", "hft", "low-latency"]
categories = ["algorithms", "finance"]

[dependencies]
arrayvec = "0.7"
rustc-hash = "1.1"

[dev-dependencies]
criterion = "0.5"
engine-protocol = { path = "../engine-protocol" }

# Commented out until we create the benchmark file
# [[bench]]
# name = "matching"
# harness = false

[lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "warn"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
