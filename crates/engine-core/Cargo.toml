[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
authors = ["Paul Lopez"]
description = "High-performance matching engine core"
keywords = ["trading", "matching-engine", "hft", "low-latency"]
categories = ["algorithms", "finance"]

[dependencies]
# No dependencies for core - keep it minimal

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "matching"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "warn"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
