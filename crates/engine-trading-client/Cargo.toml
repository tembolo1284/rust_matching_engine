[package]
name = "engine-trading-client"
version = "0.2.0"
edition = "2021"
description = "Professional trading terminal with auto-discovery and load testing"

[dependencies]
# Core dependencies
engine-core = { path = "../engine-core" }
engine-protocol = { path = "../engine-protocol" }

# TUI framework
ratatui = "0.26"
crossterm = "0.27"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Networking
bytes = "1.5"

# Data structures
indexmap = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = "0.4"

# CLI args
clap = { version = "4", features = ["derive"] }

# Random data generation for load tests
rand = "0.8"

# Statistics
hdrhistogram = "7.5"

[[bin]]
name = "trading-client"
path = "src/main.rs"

[[bin]]
name = "load-test"
path = "src/bin/load_test.rs"
